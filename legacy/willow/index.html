<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Willow Life Journal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Outfit:wght@500;600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  #toast { position: fixed; left: 50%; bottom: calc(92px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 16px); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 999px; opacity: 0; transition: opacity .3s ease, transform .3s ease; pointer-events: none; z-index: 60; max-width: 88vw; font-size: 14px; text-align: center; }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
  .topbar .brand { font-size: 20px; }
  .side-link, .nav-btn, .btn { text-decoration: none; }
  @media (min-width: 900px) { .topbar .brand { display: none; } }
  .divider { height: 14px; }
</style>
</head>
<body>
<div id="scene" aria-hidden="true"></div>
<div class="shell">
  <aside class="sidebar" id="sidebar" aria-label="Sections"></aside>
  <main class="main">
    <div class="topbar">
      <span class="brand">Willow</span>
      <span class="status-dot" id="status" role="status" aria-live="polite">Saved on this device</span>
    </div>
    <div id="view"><div class="empty">Opening Willow…</div></div>
    <p class="small muted" style="margin-top:28px;text-align:center">Willow is a companion, not a boss. Put the phone down and go outside for a while.</p>
  </main>
</div>
<nav class="bottom-nav" id="bottom" aria-label="Main sections"></nav>
<div id="toast" role="status" aria-live="polite"></div>
<div id="reminder" class="reminder" role="status" hidden>
  <p id="reminder-text"></p>
  <button class="btn small soft" type="button" data-act="dismissReminder">Got it</button>
</div>
<script src="core.js"></script>
<script src="kit.js"></script>
<script src="views-a.js"></script>
<script src="home.js"></script>
<script src="goals.js"></script>
<script src="views-b.js"></script>
<script src="mood.js"></script>
<script src="views-c.js"></script>
</body>
</html>
